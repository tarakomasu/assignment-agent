name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install test browser
        run: python -m playwright install chromium --only-shell
      - name: Build portable ZIP and test packaged executable
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Tests with bundled compiler
        shell: pwsh
        run: |
          $env:PATH = "$pwd/dist/assignment-agent/runtime/w64devkit/bin;" + $env:PATH
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-agent-windows-x64
          path: |
            dist/assignment-agent-windows-x64.zip
            dist/w64devkit-2.10.0-source.tar
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assignment-agent-windows-x64
          path: dist
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --title "Assignment Agent $RELEASE_TAG"
          --notes "Windows 10/11 x64向け。assignment-agent-windows-x64.zipをダウンロードして展開してください。初回はassignment-agent.exe login、その後assignment-agent.exe runで使用できます。Cコンパイラの対応ソースは同じリリースのw64devkit-2.10.0-source.tarです。"
